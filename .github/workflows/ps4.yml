name: PS4 CI

on:
  pull_request:
    branches: [ps4-port]
  push:
    branches: [ps4-port, fix/ps4-shadow-off-hud-diagnostics]
  workflow_dispatch:
    inputs:
      build_package:
        description: 'Build and validate a game-free PKG using the public Orbis SDK'
        type: boolean
        default: false
      original_release_baseline:
        description: 'Reconstruct original v0.1.0-ps4 source with the current hosted toolchain'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ps4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-sdk:
    name: Inspect public paired Orbis SDK
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and inspect SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbis"
          cd "$RUNNER_TEMP/orbis"
          base=https://github.com/orbis-ports/orbis-porting-kit/releases/download/orbis-sdk-v1
          curl -fLsS --retry 3 -O "$base/orbis-sdk-v1.tar.gz"
          curl -fLsS --retry 3 -O "$base/orbis-sdk-v1.tar.gz.sha256"
          sha256sum -c orbis-sdk-v1.tar.gz.sha256
          tar -xzf orbis-sdk-v1.tar.gz
          sdk="$PWD/orbis-sdk-v1"
          echo 'b86155980a3f47d48f2dec7b55559afc41dcb6039020358ec001f5a0b6ec5639  '"$sdk/BUNDLE.txt" | sha256sum -c
          cat "$sdk/BUNDLE.txt"
          cat "$sdk/toolchain/orbis-sdk.cmake"
          cat "$sdk/verify.sh"
          find "$sdk" -maxdepth 3 -type d
          find "$sdk" -name '*.cmake' -o -name '*clang*' -o -name '*ssl*' -o -name '*PkgTool*'
  ffmpeg-assembly:
    name: FFmpeg NASM assembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm
      - name: Assemble PS4 FFmpeg routines
        run: ps4/ci-check-ffmpeg-asm.sh
  gameplay-policy:
    name: PS4 shadow and HUD policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check shadow-off policy and HUD diagnostic gate
        run: python3 ps4/test-gameplay-policy.py

  orbis-build-package:
    name: Orbis build and package validation
    if: (github.event_name == 'push' && github.ref == 'refs/heads/ps4-port') || (github.event_name == 'workflow_dispatch' && inputs.build_package)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.original_release_baseline && 'd6f015fc09cb41e8f68faff2e27c9d64a256fd3a' || github.sha }}
          path: build-source
          persist-credentials: false
      - name: Prepare isolated source and baseline build-only compatibility
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.original_release_baseline }}' == true ]]; then
            # Keep all original runtime code and original dependency patches.
            # Only bring the reproducible build/package harness to the old tag.
            cp ps4/build-clean.sh build-source/ps4/
            cp ps4/patches/ReXGlue.patch build-source/ps4/patches/
            cp -a ps4/package build-source/ps4/
            python3 - <<'PY'
          from pathlib import Path
          p = Path('build-source/glue/rexglue-sdk-main/gta4-recomp/CMakeLists.txt')
          text = p.read_text()
          needle = '        ${CMAKE_CURRENT_SOURCE_DIR}/../thirdparty/stb\n'
          # The old tag needs the same pinned zlib headers as the hosted build.
          section = text.index('elseif(PS4)')
          head, tail = text[:section], text[section:]
          if needle not in tail:
              raise SystemExit('Unexpected baseline zlib include location')
          p.write_text(head + tail.replace(needle, needle + '        ${PS4_ZLIB_INCLUDE_DIR}\n', 1))
          PY
          fi
          git -C build-source rev-parse HEAD
          git -C build-source diff --check
      - uses: actions/checkout@v4
        with:
          repository: plastikman/orbis-win
          ref: 9791d98942851163a9b94548c04a7dbb07fe8895
          path: orbis-win
          persist-credentials: false
      - name: Install LLVM 19.1.7 and build tools
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" |
            sudo tee /etc/apt/sources.list.d/llvm-19.list >/dev/null
          printf 'Package: *\nPin: release o=apt.llvm.org\nPin-Priority: 1001\n' |
            sudo tee /etc/apt/preferences.d/llvm-19 >/dev/null
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang-19 lld-19 llvm-19 cmake ninja-build nasm \
            glslang-tools git python3 curl pkg-config
          for tool in clang clang++ lld ld.lld llvm-ar llvm-ranlib llvm-nm \
                      llvm-objcopy llvm-readelf llvm-strip; do
            sudo ln -sfn "/usr/bin/${tool}-19" "/usr/local/bin/$tool"
          done
          clang --version | grep -q 'version 19\.1\.7' || {
            echo 'clang must be 19.1.7 to match the validated build workstation' >&2; exit 1; }
      - name: Provision public paired Orbis SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbis"
          cd "$RUNNER_TEMP/orbis"
          base=https://github.com/orbis-ports/orbis-porting-kit/releases/download/orbis-sdk-v1
          curl -fLsS --retry 3 -O "$base/orbis-sdk-v1.tar.gz"
          curl -fLsS --retry 3 -O "$base/orbis-sdk-v1.tar.gz.sha256"
          sha256sum -c orbis-sdk-v1.tar.gz.sha256
          tar -xzf orbis-sdk-v1.tar.gz
          sdk="$PWD/orbis-sdk-v1"
          echo 'b86155980a3f47d48f2dec7b55559afc41dcb6039020358ec001f5a0b6ec5639  '"$sdk/BUNDLE.txt" | sha256sum -c
          "$sdk/verify.sh" "$sdk"
          echo "PS4_SDK_BUNDLE=$sdk" >> "$GITHUB_ENV"
          echo "OO_PS4_TOOLCHAIN=$sdk/sdk" >> "$GITHUB_ENV"
          # PkgTool's .NET runtime needs OpenSSL 1.1, absent on Ubuntu 24.04.
          git clone --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git "$RUNNER_TEMP/openssl-src"
          cd "$RUNNER_TEMP/openssl-src"
          ./config shared --prefix="$RUNNER_TEMP/openssl11" --openssldir="$RUNNER_TEMP/openssl11/ssl"
          make -j2
          make install_sw
          echo "PS4_PKGTOOL_OPENSSL_LIB=$RUNNER_TEMP/openssl11/lib" >> "$GITHUB_ENV"
      - name: Build pinned OpenOrbis module stubs
        env:
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/gta4-openorbis-stubs
        run: orbis-win/scripts/build-openorbis-module-stubs.sh
      - name: Download pinned DXC 1.9.2609
        env:
          PS4_DXC_ROOT: ${{ runner.temp }}/gta4-dxc
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/linux_dxc_2026_09_28.x86_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            -o "$archive" \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz
          echo '96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1  '"$archive" | sha256sum --check
          mkdir -p "$PS4_DXC_ROOT"
          tar --no-same-owner -xzf "$archive" -C "$PS4_DXC_ROOT"
      - name: Allocate isolated build paths
        id: paths
        shell: bash
        run: |
          root="$HOME/codex_scratch/gta4-ps4-ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "build=$root/build" >> "$GITHUB_OUTPUT"
          echo "package=$root/package" >> "$GITHUB_OUTPUT"
      - name: Build Orbis EBOOT
        env:
          PS4_BUILD_DIR: ${{ steps.paths.outputs.build }}
          PS4_BUILD_JOBS: 1
          PS4_DXC_ROOT: ${{ runner.temp }}/gta4-dxc
        run: |
          set -euo pipefail
          build-source/ps4/build-clean.sh 2>&1 | tee "$RUNNER_TEMP/orbis-build.log"
          if grep -E 'Killed|error:' "$RUNNER_TEMP/orbis-build.log"; then
            echo 'Build log contains errors; refusing to package' >&2
            exit 1
          fi
          stat "${PS4_BUILD_DIR}/glue/gta4-recomp/eboot.bin"
      - name: Build and validate game-free PKG
        env:
          PS4_BUILD_DIR: ${{ steps.paths.outputs.build }}
          PS4_PACKAGE_DIR: ${{ steps.paths.outputs.package }}
          PS4_STUBS_DIR: ${{ github.workspace }}/gta4-openorbis-stubs
          PS4_EXPECTED_LIBC_SHA256: 5680c77d0215ead1c51deb00d76c5347f306e04c81b8b1119c9fd84580ebcf94
          PS4_EXPECTED_FIOS2_SHA256: 0ab6fa2479d1c15ebdc6b7621413bfc9f89b58c97da7563bc804cef3a495ea4a
          PS4_PACKAGE_VERSION: gta4-ps4-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          PS4_FPKG_CORE_PROFILE: seven-core-default
        run: build-source/ps4/package/build-package.sh
      - name: Record build provenance
        env:
          PS4_PACKAGE_DIR: ${{ steps.paths.outputs.package }}
          PS4_DXC_ROOT: ${{ runner.temp }}/gta4-dxc
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/gta4-openorbis-stubs
        run: |
          {
            sdk_hash=$(sha256sum "$PS4_SDK_BUNDLE/BUNDLE.txt" | cut -d' ' -f1)
            dxc_version=$("$PS4_DXC_ROOT/bin/dxc" --version 2>&1 | tail -1)
            libc_hash=$(sha256sum "$PW_MODULE_STUBS_DIR/libc.prx" | cut -d' ' -f1)
            fios2_hash=$(sha256sum "$PW_MODULE_STUBS_DIR/libSceFios2.prx" | cut -d' ' -f1)
            echo "workflow_commit=$GITHUB_SHA"
            echo "gta4_commit=$(git -C build-source rev-parse HEAD)"
            echo "original_release_baseline=${{ inputs.original_release_baseline }}"
            echo "baseline_note=reconstructed source baseline; not byte-identical to original release"
            echo "config_sha256=$(sha256sum build-source/ps4/configs/native.toml | cut -d' ' -f1)"
            echo "orbis_win_runner_setup_commit=9791d98942851163a9b94548c04a7dbb07fe8895"
            echo "sdk_bundle_sha256=$sdk_hash"
            echo "dxc_version=$dxc_version"
            echo "dxc_archive_sha256=96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1"
            echo "libc_stub_sha256=$libc_hash"
            echo "fios2_stub_sha256=$fios2_hash"
            cat "$PS4_PACKAGE_DIR/SHA256SUMS"
          } > "$PS4_PACKAGE_DIR/BUILD-MANIFEST.txt"
          git -C build-source diff --binary > "$PS4_PACKAGE_DIR/SOURCE-DIFF.patch"
          git -C build-source status --short > "$PS4_PACKAGE_DIR/SOURCE-STATUS.txt"
          cat "$PS4_PACKAGE_DIR/BUILD-MANIFEST.txt"
      - name: Publish versioned PS4 PKG as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ steps.paths.outputs.package }}/out/gta4-ps4-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.pkg"
          [[ -s "$pkg" ]] || { echo "Versioned PS4 PKG missing: $pkg" >&2; exit 1; }
          tag="ps4-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$pkg" \
            --title "GTA IV PS4 — Standard build" \
            --target "$GITHUB_SHA" --prerelease \
            --notes "## What this version is

          This is the standard GTA IV PS4 test package built from the current project version.

          Install it on your PS4 to try the latest available build. If you are comparing performance, use the same game area and activity each time so the results are meaningful.

          **Version:** ${pkg##*/}

          **Build run:** ${GITHUB_RUN_ID}

          This is an experimental project build, so performance and compatibility may vary."

      - uses: actions/upload-artifact@v4
        with:
          name: gta4-ps4-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.build }}/glue/gta4-recomp/eboot.bin
            ${{ steps.paths.outputs.package }}/gta4.elf
            ${{ steps.paths.outputs.package }}/SHA256SUMS
            ${{ steps.paths.outputs.package }}/validate.log
            ${{ steps.paths.outputs.package }}/BUILD-MANIFEST.txt
            ${{ steps.paths.outputs.package }}/PACKAGE-VERSION.txt
            ${{ steps.paths.outputs.package }}/SOURCE-DIFF.patch
            ${{ steps.paths.outputs.package }}/SOURCE-STATUS.txt
            build-source/ps4/configs/native.toml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ps4-build-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/orbis-build.log
            ${{ steps.paths.outputs.package }}/build.log
            ${{ steps.paths.outputs.package }}/validate.log
          if-no-files-found: warn
      - name: Clean isolated run data
        if: always() && steps.paths.outputs.root != ''
        env:
          RUN_ROOT: ${{ steps.paths.outputs.root }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUN_ROOT']).resolve()
          parent = (Path.home() / 'codex_scratch/gta4-ps4-ci').resolve()
          if root.parent != parent or not root.name.startswith(f"{os.environ['GITHUB_RUN_ID']}-"):
              raise SystemExit(f"Refusing to clean unexpected path: {root}")
          shutil.rmtree(root, ignore_errors=True)
          PY
